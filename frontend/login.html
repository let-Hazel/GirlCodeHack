<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    



    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>


<body class="auth-body">


<div class="auth-container">


    <div class="auth-brand">

        <a href="index.html">

            Skill<span>Link</span>

        </a>

    </div>


    <div class="auth-card">

        <form id="loginForm">


            <label>
                Email address
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="you@example.com"
                required
            >



            <label>
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Create a password"
                required
            >


            <label for="loginRole">I am logging in as</label>

            <select id="loginRole" required>
                <option value="user">Service User</option>
                <option value="provider">Service Provider</option>
            </select>


            <button
                type="submit"
                class="btn btn-primary auth-button"
            >
                Login →
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="login.html">
                    Signup
                </a>
            </p>

        </div>

    </div>


</div>


<script src="js/api.js"></script>
<script src="js/auth.js"></script></body>

</html>
