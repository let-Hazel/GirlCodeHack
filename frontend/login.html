<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillLink | Login</title>

    <link rel="stylesheet" href="css/auth.css">
    


</head>

<body>

    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <main class="auth-page">

        <div class="auth-container">

            <!-- LOGO -->

            <div class="auth-logo">
                Skill<span>Link</span>
            </div>


            <!-- LOGIN CARD -->

            <div class="auth-card">

                <div class="auth-header">

                    <h1>
                        Welcome back
                    </h1>

                    <p>
                        Log in to continue to SkillLink.
                    </p>

                </div>


                <!-- =================================================
                     LOGIN FORM
                ================================================== -->

                <form id="loginForm" novalidate>

                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="loginEmail">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <!-- ROLE -->

                    <div class="form-group">

                        <label for="loginRole">
                            I am logging in as
                        </label>

                        <select
                            id="loginRole"
                            name="role"
                            required
                        >

                            <option value="user">
                                I need a service
                            </option>

                            <option value="provider">
                                I offer a service
                            </option>

                        </select>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="btn btn-primary"
                    >
                        Login
                    </button>

                </form>


                <!-- ERROR MESSAGE -->

                <div
                    id="loginMessage"
                    class="auth-message"
                    aria-live="polite"
                ></div>


                <!-- SIGN UP -->

                <div class="auth-footer">

                    <p>
                        Don't have an account?
                        <a href="signup.html">
                            Sign up
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         
         IMPORTANT:
         api.js MUST load before auth.js
    ====================================================== -->

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
